spring.application.name=voice-budget-api
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/voice-budget}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.ai.openai.api-key=${OPENAI_API_KEY:not-configured}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.speech.options.model=tts-1
spring.ai.openai.audio.speech.options.voice=alloy
spring.ai.openai.audio.speech.options.response-format=mp3

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
